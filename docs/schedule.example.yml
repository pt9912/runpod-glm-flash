# Example only. Deliberately kept outside .github/workflows/ so GitHub does not run it.
# Move it to .github/workflows/schedule.yml only after reviewing times and adding secrets.
# GitHub Actions cron is UTC. The 14/5 example below is 05:00-19:00 local time, Mon-Fri
# (early start on purpose: a free B300 is easier to find in the early morning):
#   summer (CEST, UTC+2): start 03:00 UTC, stop 17:00 UTC
#   winter (CET,  UTC+1): start 04:00 UTC, stop 18:00 UTC
# DST means you should either adjust the cron seasonally or use an external timezone-aware scheduler.
# Note: scheduled runs have no `inputs.action`; map github.event.schedule to start/stop before enabling.
name: RunPod GLM 14x5

on:
  workflow_dispatch:
    inputs:
      action:
        description: start or stop
        required: true
        type: choice
        options: [start, stop]
  # schedule:
  #   - cron: '0 3 * * 1-5'   # start 05:00 CEST (summer; winter: '0 4 * * 1-5')
  #   - cron: '0 17 * * 1-5'  # stop  19:00 CEST (summer; winter: '0 18 * * 1-5')

permissions:
  contents: read

# Never run start/stop concurrently against the same Pod.
concurrency:
  group: runpod-glm-pod
  cancel-in-progress: false

jobs:
  pod-action:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
      ACTION: ${{ inputs.action }}
    steps:
      # When enabling: pin actions by commit SHA.
      - uses: actions/checkout@v4
      - name: Guard
        run: |
          test -n "$RUNPOD_API_KEY"
          test -n "$RUNPOD_POD_ID"
      - name: Explain action
        run: |
          echo "This example intentionally does not call the RunPod API."
          echo "When enabling it, run scripts/pod-${ACTION}.sh (needs only curl and python3)."
          echo "The schedule block is disabled to prevent accidental B300 spend."
