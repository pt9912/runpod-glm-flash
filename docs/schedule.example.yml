# Example only. Deliberately kept outside .github/workflows/ so GitHub does not run it.
# Move it to .github/workflows/schedule.yml only after reviewing times and adding secrets.
# GitHub Actions cron is UTC. The 14/5 example below is 05:00-19:00 local time, Mon-Fri
# (early start on purpose: a free B300 is easier to find in the early morning):
#   summer (CEST, UTC+2): start 03:00 UTC, stop 17:00 UTC
#   winter (CET,  UTC+1): start 04:00 UTC, stop 18:00 UTC
# DST means you should either adjust the cron seasonally or use an external timezone-aware scheduler.
# The start job runs scripts/start-any.sh: it restarts the pool Pods one after the other and creates a new
# one if none can start (up to MAX_WAIT_SECONDS); a failed attempt costs nothing. The stop job runs
# scripts/stop-any.sh. The pool is every Pod whose name starts with glm-5.3-flash-b300, read live. Every successful start bills the
# GPU (B300: about $7.89/h), so review this file carefully before enabling it. If the GPU stays
# occupied, the job fails and the Pod stays stopped for that day. No start attempt begins after
# MAX_WAIT_SECONDS (an attempt already running can finish about 2 minutes later).
# Caveats: GitHub only usually notifies you about a failed run (to the user who last changed the
# cron entry, per their notification settings); cron runs can be delayed or dropped, which matters
# for the stop job; scheduled workflows of public repos with no activity for 60 days are disabled
# automatically; GitHub keeps only one PENDING run per concurrency group, so do not dispatch
# manual runs while a start is still retrying, or a queued stop can be dropped.
name: RunPod GLM 14x5

on:
  workflow_dispatch:
    inputs:
      action:
        description: start or stop
        required: true
        type: choice
        options: [start, stop]
  # schedule:
  #   - cron: '0 3 * * 1-5'   # start 05:00 CEST (summer; winter: '0 4 * * 1-5')
  #   - cron: '0 17 * * 1-5'  # stop  19:00 CEST (summer; winter: '0 18 * * 1-5')

permissions:
  contents: read

# Never run start/stop concurrently against the same Pod.
concurrency:
  group: runpod-glm-pod
  cancel-in-progress: false

jobs:
  pod-action:
    runs-on: ubuntu-latest
    # Hard cap for the whole job (the start retries for at most MAX_WAIT_SECONDS = 2 h).
    timeout-minutes: 150
    # Secrets are set per step (Guard, Start, Stop), not for the whole job, so that
    # actions/checkout and the other steps never see them.
    env:
      INPUT_ACTION: ${{ inputs.action }}
      SCHEDULE: ${{ github.event.schedule }}
      MAX_WAIT_SECONDS: "7200"
    steps:
      # When enabling: pin actions by commit SHA.
      - uses: actions/checkout@v4
      - name: Guard
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}   # needs write access to Pods
          NETWORK_VOLUME_ID: ${{ secrets.NETWORK_VOLUME_ID }}   # needed to create new Pods
        run: |
          test -n "$RUNPOD_API_KEY"
          test -n "$NETWORK_VOLUME_ID"
      - name: Decide action
        id: act
        run: |
          # Manual run: the chosen input. Scheduled run: derived from the cron entry
          # (03:00/04:00 UTC = start, 17:00/18:00 UTC = stop; adjust when you change the cron lines).
          case "${INPUT_ACTION:-}" in
            start|stop) action="$INPUT_ACTION" ;;
            *)
              case "${SCHEDULE:-}" in
                "0 3 "*|"0 4 "*) action=start ;;
                "0 17 "*|"0 18 "*) action=stop ;;
                *) echo "Cannot derive the action from schedule '${SCHEDULE:-}'" >&2; exit 1 ;;
              esac
              ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Action: $action"
      - name: Start (retries while the GPU is occupied, then stops trying)
        if: steps.act.outputs.action == 'start'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          NETWORK_VOLUME_ID: ${{ secrets.NETWORK_VOLUME_ID }}
        run: scripts/start-any.sh "$MAX_WAIT_SECONDS" 60
      - name: Stop
        if: steps.act.outputs.action == 'stop'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: scripts/stop-any.sh
